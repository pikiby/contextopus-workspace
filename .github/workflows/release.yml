name: Prepare Workspace release assets
on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Compatible Core tag or commit
        required: true
        default: main
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pikiby/contextopus-core
          ref: ${{ inputs.core_ref }}
          path: .ci/core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "./.ci/core[test]"
      - run: python -m pip install -e ".[test]" --no-deps
      - run: python scripts/test.py --core .ci/core -- -q tests
      - run: python scripts/build-release.py dist
      - run: python scripts/verify_installed.py --workspace-module dist/contextopus-workspace-1.7.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-release-assets
          path: dist/
